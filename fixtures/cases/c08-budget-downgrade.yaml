# ILLUSTRATIVE golden case. Fictional providers, made-up prices. Expected values are from PRD section 11.
id: c08-budget-downgrade
kind: sequential
illustrative: true
description: downgrade to a lower tier; the answer is not cached.
start_at: '2026-11-02T09:00:00.000Z'
catalog: ../catalog/illustrative-catalog.yaml
policy: ../policy/illustrative-policy.yaml
teams:
  support:
    budget: {period: calendar_month_utc, soft_limit_micro: 8000, hard_limit_micro: 10000, overage: downgrade, overage_cap_micro: 0}
    cache: {enabled: true, ttl_ms: 60000}
covers: [WE-18]
opening:
- {team: support, amount_micro: 9000, memo: illustrative opening balance}
scripts: {}
requests:
- we: WE-18
  at_ms: 0
  fake_output_tokens: 350
  request:
    request_id: r1
    team: support
    app: helpdesk
    use_case: reply-draft
    task_class: draft
    data_tags: []
    messages:
    - {role: user, content: Illustrative reply request}
    input_tokens: 800
    max_output_tokens: 400
    temperature: '0'
  expect:
    status: ok
    rule: support-reply
    chain: [alder-medium, birch-medium]
    cache: miss
    route_reasons: ['rule_matched:support-reply', 'limits_applied:support-reply', 'candidate:alder-medium', 'candidate:birch-medium',
      'excluded_cost:alder-large', 'excluded_cost:cedar-large', 'chosen:alder-medium']
    attempts:
    - {model: alder-small, started_ms: 0, finished_ms: 400, outcome: ok, reserved_micro: 480, cost_micro: 440}
    events: ['budget_refused:4800', downgrade_chain]
    flags: [downgraded, soft_limit_crossed]
    cost_micro: 440
    balance_after: {spent_micro: 9440, held_micro: 0}
expect_end:
  balances:
  - {team: support, period: 2026-11, spent_micro: 9440, held_micro: 0}
  ledger_entries: 3
  cache_entries: {support: 0}
  reconcile: clean
