# ILLUSTRATIVE golden case. Fictional providers, made-up prices. Expected values are from PRD section 11.
id: c09-budget-downgrade-denied
kind: sequential
illustrative: true
description: downgrade with no lower tier that fits.
start_at: '2026-11-02T09:00:00.000Z'
catalog: ../catalog/illustrative-catalog.yaml
policy: ../policy/illustrative-policy.yaml
teams:
