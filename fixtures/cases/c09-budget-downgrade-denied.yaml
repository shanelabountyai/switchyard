  expect:
    status: denied_budget
    rule: support-reply
    chain: [alder-medium, birch-medium]
    cache: bypass_team_opt_out
    attempts: []
    events: ['budget_refused:4800', downgrade_chain, 'budget_refused:480', 'budget_refused:600']
    flags: []
    cost_micro: 0
